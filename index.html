<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DShop - ไฟล์ดิจิทัลคุณภาพสูง</title>
    <meta name="description" content="ค้นพบไฟล์ดิจิทัลคุณภาพสูงสำหรับงานออกแบบและโปรเจกต์ของคุณที่ 3DShop">
    <!-- Font Awesome CDN สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Google Fonts สำหรับฟอนต์ Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 สำหรับ modal ซูม -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Favicon -->
    <link rel="icon" href="3DShop_FolderDownload_Icon.ico" type="image/x-icon">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Prompt', 'Arial', sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- src ถูกตั้งด้วย JS ด้านล่าง เพื่อส่งต่อ ?p= (ลิงก์แชร์สินค้า) และ ?ref= (ลิงก์ชวนเพื่อน) ไปให้ Apps Script -->
    <iframe id="shopIframe"
            title="3DShop"
            allowfullscreen
            onload="onIframeLoad()"
            onerror="onIframeError()"></iframe>
    <noscript>กรุณาเปิดใช้งาน JavaScript เพื่อใช้งาน 3DShop</noscript>

    <script>
        // ลิงก์ Web App ของ Apps Script (ลิงก์ /exec เดิม)
        var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzCgbqQqWPkUQv4riKRZrBmbnaRkkwjKHNlSrwSo3Yt4heTPkkBMxhClL34IJbaoBc/exec';

        // ส่งต่อเฉพาะพารามิเตอร์ที่อนุญาต (p = รหัสสินค้า, ref = รหัสชวนเพื่อน) และกรองให้เหลือตัวอักษรปลอดภัย
        function buildShopUrl() {
            var out = [];
            try {
                var params = new URLSearchParams(location.search);
                ['p', 'ref'].forEach(function (k) {
                    var v = params.get(k);
                    if (!v) return;
                    v = v.replace(/[^A-Za-z0-9_-]/g, '').substring(0, 24);
                    if (v) out.push(k + '=' + encodeURIComponent(v));
                });
            } catch (e) {
                console.warn('อ่านพารามิเตอร์ไม่ได้:', e);
            }
            return APPS_SCRIPT_URL + (out.length ? '?' + out.join('&') : '');
        }

        document.getElementById('shopIframe').src = buildShopUrl();

        // Restore sessionStorage from localStorage on page load
        (function restoreSession() {
            console.log('Restoring session...');
            const sessionData = localStorage.getItem('3DShopSession');
            if (sessionData) {
                try {
                    const { userEmail, userName, isGoogleUser } = JSON.parse(sessionData);
                    if (userEmail && userName) {
                        console.log('Restoring session:', { userEmail, userName, isGoogleUser });
                        sessionStorage.setItem('userEmail', userEmail);
                        sessionStorage.setItem('userName', userName);
                        sessionStorage.setItem('isGoogleUser', isGoogleUser);
                    }
                } catch (e) {
                    console.error('Error restoring session:', e);
                }
            }
        })();

        // Initialize zoom for images in iframe
        function initializeZoom() {
            const iframe = document.getElementById('shopIframe');

            // ใช้ try-catch เพื่อป้องกัน Cross-Origin Error
            try {
                // การเข้าถึง contentDocument ทำได้เฉพาะ Same Origin
                // หาก Google Apps Script บล็อก ส่วนนี้จะถูกข้ามไปโดยไม่ทำให้เว็บพัง
                if (!iframe || !iframe.contentDocument) return;

                const images = iframe.contentDocument.querySelectorAll('img');
                images.forEach(img => {
                    img.style.cursor = 'zoom-in';
                    img.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        Swal.fire({
                            title: 'ภาพสินค้า',
                            html: `
                                <img src="${img.src}" style="max-width:100%; max-height:80vh; border-radius:12px;" />
                            `,
                            background: '#1f2937',
                            showConfirmButton: false,
                            showCloseButton: true,
                            customClass: { popup: 'rounded-4 shadow-lg' }
                        });
                    });
                });

                iframe.contentDocument.documentElement.requestFullscreen = function() {
                    console.warn('requestFullscreen ถูกปิดการใช้งานใน iframe');
                    return Promise.reject(new Error('Fullscreen is disabled in this context'));
                };
            } catch (error) {
                console.warn('ไม่สามารถเข้าถึงเนื้อหาใน Iframe ได้เนื่องจากนโยบายความปลอดภัย (Cross-Origin):', error);
            }
        }

        // Handle iframe load
        function onIframeLoad() {
            console.log('Iframe loaded successfully');
            setTimeout(initializeZoom, 1000);
        }

        // Handle iframe load error: ลองโหลดใหม่หลัง 5 วินาที (ใช้ลิงก์เดิมรวมพารามิเตอร์)
        function onIframeError() {
            console.error('Iframe failed to load');
            setTimeout(() => {
                document.getElementById('shopIframe').src = buildShopUrl();
            }, 5000);
        }

        // Save sessionStorage to localStorage before refresh
        window.addEventListener('beforeunload', function() {
            const userEmail = sessionStorage.getItem('userEmail');
            const userName = sessionStorage.getItem('userName');
            const isGoogleUser = sessionStorage.getItem('isGoogleUser');
            if (userEmail && userName) {
                console.log('Saving session to localStorage');
                localStorage.setItem('3DShopSession', JSON.stringify({
                    userEmail: userEmail,
                    userName: userName,
                    isGoogleUser: isGoogleUser
                }));
            }
        });
    </script>
</body>
</html>
